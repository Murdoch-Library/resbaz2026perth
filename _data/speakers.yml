  id: 103
  name: A/Prof. Belinda
  surname: Brown
  pronouns:
  company: Murdoch University
  title: Dean Graduate Research
  bio: "As Dean Graduate Research at Murdoch University, I lead strategic initiatives to enhance the higher degree by research experience with a focus on researcher development, and supervision quality. I am passionate about creating supportive environments for higher degree researchers. My research aims to develop and implement interventions that can enhance brain health in older adults. My research program integrates cognitive neuroscience, neuroimaging, exercise science, genetics, and biostatistics to characterise the impact of physical activity on the brain and understand the underlying mechanisms. The overall message from my body of research is that cognitive function, brain volume and dementia-related brain markers are changeable in later life, and physical activity is a factor that may contribute to enhancing optimal brain health profiles."
