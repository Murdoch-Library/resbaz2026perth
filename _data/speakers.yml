  id: 105
  name: Dr Vivienne ‘Binyarn’
  surname: Hansen
  pronouns:
  company:
  title: Balladong Wadjuk Noongar yorga
  bio: "Dr Vivienne ‘Binyarn’ Hansen is a Balladong Wadjuk Noongar yorga, a renowned Practitioner of Noongar medicine, co-author of books Noongar Bush Medicine and Noongar Bush Tucker, the first Indigenous member of the National Herbalist Association of Australia, a founding member of the Ngangk Yira Institute for Change Council of Elders, and a recent recipient of an Honorary Doctorate from Murdoch University. She has dedicated her life to sharing, teaching, and advocating for Noongar culture, language, and knowledge. The ResBaz organising committee is honoured to have Dr Hansen delivering the Welcome to Country."
