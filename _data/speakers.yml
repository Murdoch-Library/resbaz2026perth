  pronouns:
  company: WA Data Science Innovation Hub
  title: Director
  bio: "Alex Jenkins is the Director of the WA Data Science Innovation Hub (WADSIH), Chair & Founder of the Curtin AI in Research (CAIR) Group, and inaugural Member of the WA State Government’s AI Advisory Board. With an extensive background in digital technologies, Alex is dedicated to advancing the use of AI across Australian business, academia, and the public sector. His work emphasises leveraging AI to enhance education and improve lives, driving innovation and practical applications in diverse sectors. Alex is committed to ensuring that Australia remains at the forefront of AI adoption, elevating WADSIH to a national thought-leader in AI and fostering collaboration to promote AI’s transformative potential for societal benefit. He is also known for his impactful TEDx talk, ‘An AI Tutor for Every Child’, highlighting the potential of AI in revolutionising Australia’s education system"
