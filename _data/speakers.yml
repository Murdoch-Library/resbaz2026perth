  pronouns:
  company: The University of Western Australia / Telethon Kids Institute
  title: Senior Research Fellow in Bioinformatics
  bio: 'Patricia Agudelo‑Romero is a Senior Research Fellow in Bioinformatics with a strong passion for uncovering how viruses shape human health. Her research focuses on the complex interactions between viruses, bacteria, and the human host—an area she views as central to understanding the origins of respiratory and immune diseases. At the Kids Research Institute Australia (The Kids) and The University of Western Australia, Patricia leads bioinformatics research that integrates metagenomics, transcriptomics, epigenetics, and systems biology. Her work aims to decode host–microorganism interactions in conditions such as asthma and cystic fibrosis, as well as to elucidate the role of breastfeeding in early microbial colonisation and protection against respiratory conditions. She has also developed EVEREST, an integrated computational platform for virome discovery and analysis, available in both Snakemake and Nextflow implementations.'
