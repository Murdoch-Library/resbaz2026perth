  id: 104
  name: A/Prof. Belinda
  surname: Brown
  pronouns:
  company: Murdoch University
  title: Dean Graduate Research
  bio: "Associate Professor Belinda Brown is Dean of Graduate Research (Murdoch University) and a researcher in healthy ageing and dementia prevention. Her work focuses on how lifestyle factors such as physical activity, sleep, and health behaviours influence cognitive ageing and brain health across adulthood. Alongside her research program, she leads university-wide strategy and development for higher degree by research training and researcher development. Belinda has worked with HDR candidates and early career researchers across diverse disciplines, giving her a unique perspective on the realities of research careers. She is passionate about building supportive research cultures, and helping researchers develop the skills to thrive in academia and beyond."
