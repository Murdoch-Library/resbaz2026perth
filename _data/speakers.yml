  name: Prof. Andreas
  surname: Wicenec
  pronouns:
  company: International Centre for Radio Astronomy Research (ICRAR)
  title: Director of the Data Intensive Astronomy Program at ICRAR
  bio: 'Professor at the University of Western Australia since 2010, leading the Data Intensive Astronomy Program (DIA) of the International Centre for Radio Astronomy Research (ICRAR) to research, design and implement Petabyte scale data flows and high performance scientific computing for the Square Kilometre Array, the Murchison Wide Field Array (MWA), the Australian SKA Pathfinder. During his graduate, post-graduate and post-doctoral appointments, he was involved in the software development and reduction of photometric and astrometric Tycho data from the ESA Hipparcos satellite. He joined the European Southern Observatory (ESO) in 1997 as an archive specialist and was involved in the final implementation of the archive for ESOs Very Large Telescope (VLT) and the ESO Imaging Survey. Between 2002 and 2010, he was employed as ESOs Archive Scientist and led the development group of the ALMA archive subsystem. Prof. Wicenec is also involved in the International Virtual Observatory Alliance (IVOA). His scientific interests and publications include high precision global astrometry, optical background radiation, stellar photometry, dynamics and evolution of planetary nebulae and observational survey astronomy and the related data management, scheduling and computational concepts.'
