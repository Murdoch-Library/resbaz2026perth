  name: Dr. Sean
  surname: Buckley
  pronouns:
  company: Edith Cowan University
  title:
  bio: 'Sean is a conservation and ecological geneticist with a focus on understanding how evolutionary and genomic research can inform conservation management of biodiversity. His research spans population genetics, phylogeography, and adaptive genomics, with applications in conservation planning, conservation translocations (including genetic rescue), and threatened species recovery. He works across a range of Australian fauna - (currently) including freshwater fishes, marsupials, reptiles, and birds - using genomic tools to address real-world conservation challenges. As a science communicator, he is also passionate about making science accessible, inclusive, and engaging. He regularly communicates science through outreach talks, media contributions, and his long-running blog The G-CAT, which explores conservation, ecology, evolution and genetics. As the Edith Cowan University representative in the Pawsey Supercomputing Research Centre Champions Program, he is also passionate about supporting research staff and students to use and engage with high-performance computing capabilities.'
