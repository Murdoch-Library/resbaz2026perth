  id: 101
  name: Prof. Peter
  surname: Eastwood
  pronouns:
  company: Murdoch University
  title: Deputy Vice-Chancellor (Research and Innovation)
  bio: "Professor Peter Eastwood is an experienced Australian biomedical research scientist who has built an internationally recognised research programme in sleep and respiratory physiology. He is currently the Deputy Vice Chancellor Research & Innovation at Murdoch University, WA. He has previously held appointments as: Dean of Research, College of Medicine & Public Health and Director, Flinders Health & Medical Research Institute at Flinders University, SA; a NHMRC Senior Research Fellow at the West Australian Sleep Disorders Research Institute, Sir Charles Gairdner Hospital, Professor at the School of Anatomy and Human Biology, University of Western Australia and Adjunct Professor at Curtin University of Technology. He is also Director of the Raine Study, Foundation Director of the Centre for Sleep Science at the University of Western Australia, President of the Australasian Sleep Association, immediate past Deputy Director of the Lung Institute of Western Australia, and immediate past Editor in Chief of Respirology, the major respiratory journal in the Asian Pacific."
