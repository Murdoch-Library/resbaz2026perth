- id: 148
  title: 'Carpentries: The Unix Shell'
  themes: 
  - Carpentries
  - Hands-on workshop
  speakers:
  - 243
  - 244
  - 215
  hidden: false
  description: 'This hands-on session introduces researchers to the Unix command line — a powerful tool for automating repetitive tasks and managing data efficiently. No prior experience is required. Participants will learn to navigate the file system, work with files and directories, combine commands using pipes, and write simple shell scripts. By the end of the session, you will have the foundational skills to work faster and smarter with your data. https://swcarpentry.github.io/shell-novice'
- id: 149
  title: 'Carpentries: Version Control with Git'
  themes: 
  - Carpentries
  - Hands-on workshop
  speakers:
  - 243
  - 244
  - 215
  hidden: false
  description: 'This session introduces version control using Git — an essential skill for anyone working with code, data, or documents. Participants will learn how to track changes, collaborate with others, and maintain a clear history of their work. We will ll cover the basics of creating repositories, committing changes, and working with remote repositories on GitHub. Whether you are working solo or in a team, Git will transform how you manage your research projects. https://swcarpentry.github.io/git-novice/'
- id: 150
  title: 'Carpentries: R for Reproducible Scientific Analysis'
  themes: 
  - Carpentries
  - Hands-on workshop
  speakers:
  - 243
  - 244
  hidden: false
  description: 'This session introduces researchers to R and RStudio for data analysis and visualisation. Using the Gapminder dataset as a practical example, participants will learn to load and manipulate data, create publication-quality plots with ggplot2, and write clean, reproducible analysis scripts. This session emphasises good coding practices that make your research transparent, shareable, and reproducible. https://swcarpentry.github.io/r-novice-gapminder/'
- id: 151
  title: 'An Enquiry into the Triple Bottom Line of Sustainability'
  themes: 
  - Hands-on workshop
  speakers:
  - 239
  hidden: false
  description: 'Since its formal endorsement by the United Nations General Assembly in 1987, following the Brundtland Report, Sustainable Development (SD) has become a dominant global policy framework. Its evolution has included key methodological shifts, notably the adoption of the Triple Bottom Line (TBL) in 1997 to integrate economic, social, and environmental dimensions. However, TBL has been widely critiqued for its limited capacity to address cultural contexts. This workshop critically examines these limitations and proposes the Quadruple Bottom Line (QBL) as an expanded framework, emphasising culture as an essential pillar for more inclusive and context-sensitive sustainability practice.'
- id: 152
  title: "Introduction to coding agents (Claude Code)"
  themes:
  - Informational talk
  speakers:
  - 200
  hidden: false
  description: 'This talk introduces coding agents, focusing on Claude Code. Coding agents are AI tools that use Large Language Models to interpret natural language and perform tasks. Agents can help researchers write code, analyse data, plan research, and prototype ideas. The session will show how Claude Code works and how it can be used in research workflows. It will demonstrate effective use of Claude Code and highlight its limitations.'