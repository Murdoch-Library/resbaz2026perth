- id: 124
  title: Value of human-in-the-loop AI for research
  themes:
  - Informational talk
  speakers:
  - 214
  hidden: false
  description: This session will discuss the importance of a human-in-the-loop (HITL)
    approach to AI for research. HITL provides greater autonomy, responsibility, reliability
    and transparency over how the AI works and its outputs, which are in accord with
    the AI ethics principles in Australia and internationally. There will also be
    a live demonstration of an AI platform that uses HITL machine learning on textual
    data. The user can directly change the AI’s answers and improvements become immediately
    and permanently part of the AI’s learning. Further advantages of this human-centred
    AI platform include more flexibility, privacy, security, cost effectiveness and
    environmental sustainability.
- id: 125
  title: Hands-on Introduction to CPU Parallel Programming with OpenMP.
  themes:
  - Hands-on workshop
  speakers:
  - 215
  hidden: false
  description: This hands-on workshop introduces OpenMP, a widely used shared-memory
    parallel programming model. Participants will learn how to enable CPU parallelism
    by creating and coordinating threads, managing data sharing, parallelising loops,
    balancing workloads, and ensuring correct synchronisation. The session also covers
    key OpenMP constructs and execution models. It is designed for participants with
    prior experience in C, C++, or Fortran who want to improve performance through
    parallel programming.
