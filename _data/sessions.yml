- id: 128
  title: 'Social Media Analytics: From TikTok to Human Insights'
  themes:
  - Informational talk
  speakers:
  - 217
  hidden: false
  description: 'Social media has evolved from a communication tool into a powerful part of everyday life, shaping how people interact, make decisions, and express themselves. At the same time, the vast amount of multimodal and largely unstructured data generated on these platforms presents significant challenges for analysis. This session unpacks the social media analytics workflow, from data collection and analysis to the generation of meaningful insights. Drawing on examples from digital multimodal data, the session explores how social media can serve as a rich source for understanding human behaviour and social phenomena. By bridging data-driven methods with social science perspectives, the session demonstrates how valuable human insights can be extracted from complex online environments.'
- id: 129
  title: 'Synthetic Data Generation Program'
  themes:
  - Informational talk
  speakers:
  - 218
  hidden: false
  description: |-
    Launched in late 2022, Synthetic Data Generation (SDG) Program with WA Department of Health (the Department) aimed to improve data accessibility, expand data capacity, and reduce the time for data provisioning. After three years’ development, the Department has established a Synthetic Health Database including diverse categories of synthetic data products. In addition, the Department has endorsed the Synthetic Data Governance and Technical Guidelines which guided the practices of synthetic data management, governance, and applications. We would like to share with the researchers the insights of synthetic data generation using machine learning models and synthetic data application pathways.
    In addition, the Department has endorsed the Synthetic Data Governance and Technical Guidelines which guided the practices of synthetic data management, governance, and applications. We would like to share with the researchers the insights of synthetic data generation using machine learning models and synthetic data application pathways.
