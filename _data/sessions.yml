- id: 137
  title: Accelerate Your Research with Cloud Computing on the ARDC Nectar Research
    Cloud
  themes:
  - Hands-on workshop
  speakers:
  - 240
  hidden: false
  description: "Don't let limited computing power slow down your research. The ARDC\
    \ Nectar Research Cloud provides fast and scalable computing resources tailored\
    \ specifically for research.\n\nWhether you need to run intensive data analyses\
    \ and complex simulations, train AI and ML models, manage big data or collaborate\
    \ seamlessly across institutions, Nectar gives you the computational power to\
    \ scale up your work.\n\nJoin us for an interactive introduction to Nectar, where\
    \ we'll cover:\n* What is cloud computing and how can it accelerate my research?\n\
    * Real-world case studies powered by Nectar.\n* Guidance on accessing tutorials\
    \ and ongoing support.\n* Live Q&A to answer your questions. \nNo cloud computing\
    \ or coding experience is required to attend."
- id: 138
  title: 'Accessing and Analysing Research Trends with Python/R and Academic APIs'
  themes: []
  speakers:
  - 236
  hidden: false
  description: 'This session introduces participants to using academic APIs, including Web of Science Starter and Expanded APIs, to retrieve and analyse research metadata using ready-to-use Python and R templates. Participants will learn :
 • how academic APIs return structured metadata
 • how to make basic queries using existing Python/R templates
 • how to extract common metadata fields (titles, keywords, authors, citation counts)
 • how to interpret results for trend detection and generate simple visualisations of topic evolution using prebuilt examples. 
 
    All examples are beginner friendly, and all code will be provided for post-workshop use. This session is cross-disciplinary and relevant across sciences, social sciences, and humanities.'
- id: 139
  title: 'Work Smarter, Not Harder: The Researcher’s Guide to national digital research
    tools, services and training'
  themes:
  - Informational talk
  speakers:
  - 240
  - 210
  - 215
  - 207
  - 241
  hidden: false
  description: "Discover how Australia’s National Research Infrastructure (NRI) can\
    \ support you in your research journey. NRI is a network of tools, data platforms\
    \ and expert support designed to make research easier and more effective. \n\n\
    Through a series of lightning talks, you will be introduced to key NRI tools and\
    \ services, including high performance computing, national scale data platforms,\
    \ bioinformatics, data linkage, high-quality data assets and cloud computing.\
    \ You will learn how these can help you optimise your workflow, overcome common\
    \ research challenges and save time on routine tasks.\n\nYou will also find out\
    \ where to access training and support, so you can confidently use these national\
    \ resources to accelerate your research.
    Co-Speaker details
      - Meirian Lovelace-Tozer, Skills Development Lead (Services), Australia Research Data Commons (ARDC)
      - Sarah Thomas, Portfolio Manager, Australian Access Federation (AAF)
      - Dr Sara King, Training and Engagement Lead, AARNet
      - Mzingisi Mqhum, Stakeholder Engagement Manager, Australian Urban Research Infrastructure Network (AURIN)  
      - Dr Ludovic Capelli, Training and Education Manager, Pawsey Supercomputing Research Centre 
      - Dr Kate Miller, Coordinator, Senior Specialist, Science and Partnerships, Population Health Research Network (PHRN)
    Contributed to content
      - Dr Abduallah Shaikh, Digital Skills Development Manager, National Computational Infrastructure (NCI)
      - Dr Paige Martin, Team Lead, User Training, ACCESS-NRI
      - Dr Melissa Burke, Training Manager, Australian BioCommons"
- id: 140
  title: 'Community choreography: Practical facilitation skills for collaborative researchers'
  themes:
  - Hands-on workshop
  speakers:
  - 226
  hidden: false
  description: 'A thriving research culture is only as strong as the community that supports it. Yet the essential soft skills required to facilitate teams, build Communities of Practice, and support your peers are rarely formally taught. Most of us end up learning these critical leadership skills by accident or through absolute disasters. This highly practical workshop introduces fundamentals of community facilitation for postgraduate students. We will explore a vital blend of pedagogy and performativity to get people engaged and keep them working together effectively. Drawing on evidence-based research and ARDC skills community mentoring strategies, this session builds skills you can immediately apply to uplift your own research networks. Participants will gain practical tips, peer-training guides and evocative metaphors such as the choreography of icebergs.'
