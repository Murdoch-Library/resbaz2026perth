- id: 117
  title: 'Beyond Point-and-Click: Reproducible Statistical Workflows in Stata'
  themes:
  - Informational talk
  speakers:
  - 211
  hidden: false
  description: This session introduces Stata as a powerful tool for statistical analysis,
    with a focus on how it supports reproducible research. Moving beyond point-and-click
    workflows, it will explore how do-files enable you to automate analyses, and how
    log files can be used to create a record of your work. Through live demonstrations,
    you will learn how to structure analyses, manage data and generate results that
    can be easily shared and reproduced. Designed for beginners or anyone curious
    about using Stata, this interactive session will highlight how it can improve
    efficiency, collaboration and research integrity.
- id: 118
  title: 'The invisible glue: Trust and Identity for research and innovation'
  themes:
  - Informational talk
  speakers:
  - 212
  hidden: false
  description: This session will discuss the purpose of the Australian Access Federation,
    the value we add to the research and innovation ecosystem, and what tools and
    services currently exist to support the research community. We will also discuss
    our roadmap of infrastructure improvements and how the community can be involved
    in co-designing future trust and identity infrastructure.
