- id: 139
  title: 'Work Smarter, Not Harder: The Researcher’s Guide to national digital research
    tools, services and training'
  themes:
  - Informational talk
  speakers:
  - 225
  hidden: false
  description: "Discover how Australia’s National Research Infrastructure (NRI) can\
    \ support you in your research journey. NRI is a network of tools, data platforms\
    \ and expert support designed to make research easier and more effective. \n\n\
    Through a series of lightning talks, you will be introduced to key NRI tools and\
    \ services, including high performance computing, national scale data platforms,\
    \ bioinformatics, data linkage, high-quality data assets and cloud computing.\
    \ You will learn how these can help you optimise your workflow, overcome common\
    \ research challenges and save time on routine tasks.\n\nYou will also find out\
    \ where to access training and support, so you can confidently use these national\
    \ resources to accelerate your research."
