- id: 107
  title: 'Working with frequency mismatch between dependent and independent variables'
  themes:
  - Hands-on workshop
  speakers:
  - 238
  hidden: false
  description: 'In finance research, one of the most significant issues is the inconsistency in the frequency of dependent and independent variables. This problem is more crucial when incorporating macroeconomic factors into research using financial indices whose data is mostly daily. Some scholars employ an interpolation process to address the issue; nevertheless, it can not restore the nature of macroeconomic data and makes the estimation biased. This hands-on workshop addresses this data frequency mismatch using a quantitative method called GARCH-MIDAS. It will demonstrate how to conduct the GARCH-MIDAS regression in an equation where the dependent variable is daily data, while the independent variable is monthly. The estimation is performed in the academic version of EViews 14.'
- id: 108
  title: Who tips more? Find out with a hands-on Python visualization workshop
  themes:
  - Informational talk
  speakers:
  - 202
  hidden: false
  description: Often times a pattern or trend is hidden in data, but can you always
    spot it? A lot of times, data alone does not tell the whole story. In this hands-on
    session we will use a real world dataset on restaurant tipping behavior and find
    out whether bigger tables tip more generously, whether day of the week influences
    tipping and so on by creating different plots to visualise relationships between
    data. We will run cells in Google Colab to get instant charts, plots and visually
    see how the elements of data are related and how they influence each other.
- id: 109
  title: Hello reproducibility! Build your first Nextflow workflow
  themes:
  - Hands-on workshop
  speakers:
  - 203
  hidden: false
  description: Reproducibility shouldn’t be this mysterious thing we all aim for but
    rarely achieve. In this hands-on session, we’ll go through the basics of Nextflow
    using the “Hello Nextflow” tutorial as a starting point. You’ll build a simple
    pipeline step by step, see how processes fit together, and get a feel for how
    data moves through a workflow. The goal is to show how Nextflow helps you organise
    your analyses so they can be run again, shared, and scaled without everything
    breaking. If you’ve ever struggled with “it worked on my machine,” this session
    is for you.
- id: 110
  title: 'Data Linkage: Unlocking Research Insights with the WA Data Linkage System
    (WADLS)'
  themes:
  - Informational talk
  speakers:
  - 204
  hidden: false
  description: Data linkage transforms siloed datasets into a powerful, interconnected
    evidence base. This gives you the power to explore relationships between isolated
    datasets, opening the door to questions you could never answer otherwise. The
    Western Australian Data Linkage System (WADLS), based at the Department of Health,
    is among the most comprehensive and high‑quality linkage systems worldwide. It
    routinely integrates data from a broad range of Health and non‑Health sources
    and provides linked datasets to support research. This presentation will serve
    as an introduction to data linkage for researchers - how it works, why it matters,
    and how to access linked data.
- id: 111
  title: 'Metadata matters: practical FAIR skills every researcher needs'
  themes:
  - Hands-on workshop
  speakers:
  - 205
  hidden: false
  description: "Your research is only as valuable as your ability to find, understand,\
    \ and reuse it, by you and others. Yet most researchers are never formally trained\
    \ in creating high-quality metadata.\nThis highly practical, hands-on workshop\
    \ introduces the fundamentals of research data management and the FAIR Principles\
    \ (Findable, Accessible, Interoperable, Reusable), with real-world examples. The\
    \ session focuses on building skills you can immediately apply to your own data\
    \ outputs and use to help others improve theirs.\nParticipants will work directly\
    \ with example datasets and are encouraged to bring their own to:\n• understand\
    \ what makes metadata useful and why it’s often done poorly\n• learn how to write\
    \ clear and reusable metadata \n• explore emerging approaches, including AI-assisted\
    \ prompts, to support metadata creation\nBy the end of the session, you will leave\
    \ with practical tools, templates, and confidence to improve your data practices,\
    \ enhancing the visibility, impact, and longevity of your research."
- id: 112
  title: Applied data science for mining geochemistry with Python
  themes:
  - Hands-on workshop
  speakers:
  - 206
  hidden: false
  description: This hands-on workshop explores how Python and data science workflows
    can support geochemical analysis in mining and environmental projects. Participants
    will learn how to transform laboratory spreadsheets into analysis-ready datasets,
    automate geochemical calculations and domain-specific plots used in the industry,
    perform exploratory data analysis, and generate technical visualisations and reports.
    The session emphasises reproducible workflows and transparent data processing
    practices increasingly expected in both research and industry. Using realistic
    datasets, attendees will gain practical experience with simple, interpretable
    techniques that form the foundation of more advanced approaches such as machine
    learning and deep learning. The workshop is designed for beginners and provides
    a foundation for geoscientists interested in applying Python to environmental
    and mining geochemistry.
- id: 113
  title: 'When Data Connects: Improving Research with Linked Data'
  themes:
  - Hands-on workshop
  speakers:
  - 207
  hidden: false
  description: 'This presentation explores how linked administrative and routinely collected data can be used more effectively across research. It explains how linking datasets allows researchers to connect information from multiple sources, enabling richer, longitudinal, and more complete analyses. The talk highlights common barriers such as difficulty discovering what data exists, complex access processes, and limited early-stage visibility of available datasets. It introduces resources for researchers, including tools to improve data discoverability, access, and usability, guided support, and training to help researchers integrate linked data more easily into study design, analysis, and long-term research workflows.'
- id: 114
  title: 'Meet People Where They Are: Designing Inclusive Research'
  themes:
  - Informational talk
  speakers:
  - 208
  hidden: false
  description: Inclusive research takes more than good intentions. In this session,
    we share how Curtin's Engagement & Student Experience team made research participation
    more inclusive. Drawing on user research from 2025, we’ll explore flexible online
    and in-person methods, placement of feedback points where students already are,
    and targeted recruitment and incentive options to reach diverse participants.
    Walk away with practical ideas and food for thought for researchers seeking to
    broaden participation through a user experience lens and beyond traditional research
    frameworks.
- id: 115
  title: 'From Research to Relevance: Storytelling and communicating your work with
    impact'
  themes:
  - Hands-on workshop
  speakers:
  - 209
  hidden: false
  description: Participants will transform their own research into a clear, audience-specific
    narrative by structuring it as a story, adapting it for different audiences (e.g.
    public, industry, policy), and refining their language to remove jargon while
    maintaining credibility and expertise.
