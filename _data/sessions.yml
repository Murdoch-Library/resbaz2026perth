- id: 131
  title: 'Understanding Data as a Non-Digital Scholar: Confusion to Clarity'
  themes:
  - Informational talk
  speakers:
  - 220
  hidden: false
  description: Data literacy is not about coding or advanced analytics. It is about
    the ability to understand, interpret, question, and communicate information in
    meaningful ways. In today’s data-driven world the ability to understand and interpret
    data is no longer limited to technical experts but to everyone. For non-digital
    scholars, data literacy means using data as a tool to strengthen arguments, support
    decision-making, and enhance understanding across different contexts. This talk
    is designed to simplify data literacy by breaking down key concepts into accessible
    and practical insights. It aims to build confidence by showing that meaningful
    engagement with data does not require advanced technical skills, but rather a
    clear understanding of how to interpret and apply information in research and
    decision-making.
- id: 132
  title: 'Empowering Research Impact with AI: Practical Tools for Modern Communication'
  themes:
  - Hands-on workshop
  speakers:
  - 221
  hidden: false
  description: As research faces growing demands for visibility and real-world influence,
    AI tools are transforming how findings are communicated. This 90-minute hands-on
    workshop introduces accessible AI applications for crafting compelling abstracts,
    visuals, summaries, public narratives, and audience-tailored outputs. Participants
    will practice tools for drafting, editing, data visualisation, and ethical use
    (addressing accuracy, bias, and attribution). With a focus on Gen Z researchers
    - who are digital natives leading AI adoption in daily workflows - this session
    equips attendees across disciplines to boost impact, funding, and outreach. No
    prior AI experience needed; bring your laptop for interactive exercises.
- id: 133
  title: 'FAIR, Attributed, Harmonized and AI-Ready by Design: Turning Instrument Output into a Strategic Institutional Asset'
  themes: 
  - Sponsor
  speakers:
  - 242
  hidden: false
  description: 'LabArchives Introduces Luma Lab Connect — Enterprise Research Data Management (RDM) Gateway for Shared Resources. Academic and Research institutions are not short on data. They are short on attribution, continuity, context, standardization and institutional visibility across the data their Shared Research Resources and lab-owned instruments already generate. Join LabArchives for a webinar on how the Luma Lab Connect service is designed to help institutions aggregate, harmonize, standardize, and govern instrument data to support reproducibility, grant funding & accountability, FAIR readiness, AI-readiness, and stronger operational intelligence - without rip-and-replace infrastructure changes.'
- id: 134
  title: Can AI Tell If You’re Empathic? Detecting Empathy from Text and Video Interactions
  themes:
  - Informational talk
  speakers:
  - 222
  hidden: false
  description: Empathy detection is an emerging topic at the intersection of natural
    language processing, computer vision and psychology. In this presentation, we
    explore how foundation models can address key barriers in this field. We will
    see that large language models can guide smaller language models for text-based
    empathy detection and achieve state-of-the-art results on benchmark tasks. Next,
    we will explore uncertainty quantification in language modelling to enable robust
    and trustworthy empathy computing systems. For video-based empathy detection,
    we will discuss how tabular foundation models achieve strong accuracy and cross-subject
    generalisation while respecting privacy constraints. We will conclude with potential
    applications of such empathy detection systems across various real-life scenarios.
- id: 135
  title: Enhancing Research Efficiency with SCOPUS AI
  themes:
  - Hands-on workshop
  speakers:
  - 223
  hidden: false
  description: This 30-minute hands-on workshop introduces researchers to the practical
    use of SCOPUS AI for improving literature searches and research analysis. Participants
    will learn how to use AI-assisted tools to identify relevant publications, map
    key themes, and generate concise research summaries. The session includes guided
    exercises demonstrating how SCOPUS AI can help refine search strategies, uncover
    emerging trends, and support evidence-based writing. Suitable for academics, postgraduates,
    and research staff looking to integrate AI capabilities into their research workflow
    for greater efficiency and insight.
