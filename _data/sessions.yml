- id: 134
  title: Can AI Tell If You’re Empathic? Detecting Empathy from Text and Video Interactions
  themes:
  - Informational talk
  speakers:
  - 222
  hidden: false
  description: Empathy detection is an emerging topic at the intersection of natural
    language processing, computer vision and psychology. In this presentation, we
    explore how foundation models can address key barriers in this field. We will
    see that large language models can guide smaller language models for text-based
    empathy detection and achieve state-of-the-art results on benchmark tasks. Next,
    we will explore uncertainty quantification in language modelling to enable robust
    and trustworthy empathy computing systems. For video-based empathy detection,
    we will discuss how tabular foundation models achieve strong accuracy and cross-subject
    generalisation while respecting privacy constraints. We will conclude with potential
    applications of such empathy detection systems across various real-life scenarios.
- id: 135
  title: Enhancing Research Efficiency with SCOPUS AI
  themes:
  - Hands-on workshop
  speakers:
  - 223
  hidden: false
  description: This 30-minute hands-on workshop introduces researchers to the practical
    use of SCOPUS AI for improving literature searches and research analysis. Participants
    will learn how to use AI-assisted tools to identify relevant publications, map
    key themes, and generate concise research summaries. The session includes guided
    exercises demonstrating how SCOPUS AI can help refine search strategies, uncover
    emerging trends, and support evidence-based writing. Suitable for academics, postgraduates,
    and research staff looking to integrate AI capabilities into their research workflow
    for greater efficiency and insight.
