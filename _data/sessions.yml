- id: 142
  title: 'Panel Discussion: Research to Impact - Communicating for Change'
  themes:
  - Panel
  speakers:
  - 201
  - 226
  - 220
  hidden: false
  description: 'Research and research data generate valuable insights, but how do those insights move beyond disciplinary boundaries and into practice? This panel explores how research skills and expertise are translated across different contexts, and how we support learning to become meaningful real‑world action. Panellists will discuss communities of practice, facilitation, and skills‑focused learning spaces. This includes how complex information—data, evidence, and analysis—is communicated to practitioners, industry, policy makers, and communities. The discussion will consider how interpretation and sense‑making shape confidence and capability, how impact can be recognised and evaluated, and how institutions can create spaces for cross‑disciplinary skill‑building that leads to change.'
