- id: 104
  title: 'Keynote - What makes researchers thrive?'
  themes:
  - Keynote
  speakers:
  - 104
  hidden: false
  description: 'This presentation will reflect on the habits and behaviours that seem to distinguish researchers who flourish in the early stages of their career, and over the long term. Drawing on experience supervising research students and leading HDR programs, this talk explores what actually predicts growth and resilience in research careers; and why it is often not what people expect.'
- id: 105
  title: Vim text editing for research
  themes:
  - Informational talk
  speakers:
  - 200
  hidden: false
  description: |-
    Vim is a powerful, keyboard-driven text editor that enables fast and efficient editing, particularly in cloud-based environments where graphical tools are limited. Vim integrates well with tools such as LaTeX, Git, and command-line utilities, making it useful for writing, coding, and data manipulation.
    This 30-minute beginner-friendly session introduces Vim fundamentals in the context of research workflows, focusing on modal editing, navigation, and core commands. Participants will learn practical techniques to navigate and edit files, and begin building a flexible workflow for coding and text-based research tasks.
