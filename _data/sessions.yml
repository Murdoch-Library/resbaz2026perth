- id: 121
  title: 'Panel Discussion: AI in Research - what is coming'
  themes:
  - Panel
  speakers:
  - 102
  - 214 
  - 221
  - 233
  hidden: false
  description: 'As AI tools become embedded in research practice, questions are emerging about impact, ethics, authorship, and the changing role of researchers themselves. This panel explores what’s coming next for AI in research deliverables, communication, and data science. Panellists will discuss how AI is being used to support writing, visualisation, interpretation, and public engagement, alongside human‑in‑the‑loop (HITL) approaches. The session invites perspectives on AI ethics, research workflows, and how researchers can adopt AI critically and responsibly for research impact and innovation. Chaired by Dr. Ranjodh B. Singh (Curtin University)'
