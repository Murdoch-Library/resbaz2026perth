- id: 131
  title: 'Understanding Data as a Non-Digital Scholar: Confusion to Clarity'
  themes:
  - Informational talk
  speakers:
  - 220
  hidden: false
  description: Data literacy is not about coding or advanced analytics. It is about
    the ability to understand, interpret, question, and communicate information in
    meaningful ways. In today’s data-driven world the ability to understand and interpret
    data is no longer limited to technical experts but to everyone. For non-digital
    scholars, data literacy means using data as a tool to strengthen arguments, support
    decision-making, and enhance understanding across different contexts. This talk
    is designed to simplify data literacy by breaking down key concepts into accessible
    and practical insights. It aims to build confidence by showing that meaningful
    engagement with data does not require advanced technical skills, but rather a
    clear understanding of how to interpret and apply information in research and
    decision-making.
- id: 132
  title: 'Empowering Research Impact with AI: Practical Tools for Modern Communication'
  themes:
  - Hands-on workshop
  speakers:
  - 221
  hidden: false
  description: As research faces growing demands for visibility and real-world influence,
    AI tools are transforming how findings are communicated. This 90-minute hands-on
    workshop introduces accessible AI applications for crafting compelling abstracts,
    visuals, summaries, public narratives, and audience-tailored outputs. Participants
    will practice tools for drafting, editing, data visualisation, and ethical use
    (addressing accuracy, bias, and attribution). With a focus on Gen Z researchers
    - who are digital natives leading AI adoption in daily workflows - this session
    equips attendees across disciplines to boost impact, funding, and outreach. No
    prior AI experience needed; bring your laptop for interactive exercises.
